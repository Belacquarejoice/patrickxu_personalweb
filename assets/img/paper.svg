<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- 铅画纸 / 水泥墙质感：横向拉长的分形噪声做高度图，侧光打出凹凸。
       只负责“质感”（明暗起伏），颜色由 CSS 里的 paper 变量决定。
       想更明显：调大 surfaceScale；想更细：调大 baseFrequency。 -->
  <filter id="f" filterUnits="userSpaceOnUse" x="0" y="0" width="420" height="420" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.016 0.04" numOctaves="4" seed="7" stitchTiles="stitch" result="relief"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.14 0.22" numOctaves="2" seed="3" stitchTiles="stitch" result="tooth"/>
    <feComposite in="relief" in2="tooth" operator="arithmetic" k2="0.8" k3="0.3" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2" diffuseConstant="1.18" lighting-color="#ffffff" result="lit">
      <feDistantLight azimuth="250" elevation="50"/>
    </feDiffuseLighting>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.3" intercept="0.72"/>
      <feFuncG type="linear" slope="0.3" intercept="0.72"/>
      <feFuncB type="linear" slope="0.3" intercept="0.72"/>
    </feComponentTransfer>
  </filter>
  <rect width="420" height="420" filter="url(#f)"/>
</svg>
